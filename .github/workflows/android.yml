name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Capacitor runtime for plain JS
        run: |
          mkdir -p web
          if [ -f node_modules/@capacitor/core/dist/capacitor.js ]; then
            cp node_modules/@capacitor/core/dist/capacitor.js web/capacitor.js
          else
            echo "ERROR: capacitor.js not found"
            ls -la node_modules/@capacitor/core/dist/ || true
            exit 1
          fi

      # android/ в .gitignore — каждый раз создаём платформу заново
      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MusicVideoMaker.apk
          ls -lh MusicVideoMaker.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicVideoMaker-apk
          path: MusicVideoMaker.apk
          retention-days: 14

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Android APK (latest)
          body: |
            Свежая сборка приложения.
            Скачай **MusicVideoMaker.apk** и установи на телефон.

            (debug-сборка)
          files: MusicVideoMaker.apk
          draft: false
          prerelease: false
